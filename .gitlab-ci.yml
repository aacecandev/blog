stages:
  - build
  - sync
  - publish
  - deploy

variables:
  STORAGE_DRIVER: vfs
  BUILDAH_STORAGE: ${CI_PROJECT_DIR}/.buildah
  BACKEND_IMAGE: ${CI_REGISTRY_IMAGE}/backend
  FRONTEND_IMAGE: ${CI_REGISTRY_IMAGE}/frontend
  CHART_REGISTRY: oci://${CI_REGISTRY_IMAGE}/charts

.build-template: &build-template
  stage: build
  image: quay.io/buildah/stable
  tags:
    - aacecandev
    - proxmox
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - .buildah/
  before_script:
    - mkdir -p ${BUILDAH_STORAGE}/storage ${BUILDAH_STORAGE}/runroot
    - |
      cat > /tmp/storage.conf <<EOF
      [storage]
      driver = "vfs"
      graphroot = "${BUILDAH_STORAGE}/storage"
      runroot = "${BUILDAH_STORAGE}/runroot"
      EOF
    - export CONTAINERS_STORAGE_CONF=/tmp/storage.conf
    - buildah login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}

build-backend:
  <<: *build-template
  rules:
    - changes:
        - src/backend/**/*
  script:
    - buildah bud --layers
      -t ${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}
      -t ${BACKEND_IMAGE}:latest
      -f src/backend/Dockerfile
      src/backend
    - buildah push ${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah push ${BACKEND_IMAGE}:latest

build-frontend:
  <<: *build-template
  rules:
    - changes:
        - src/frontend/**/*
  script:
    - buildah bud --layers
      --build-arg VITE_API_URL=/api
      -t ${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}
      -t ${FRONTEND_IMAGE}:latest
      -f src/frontend/Dockerfile
      src/frontend
    - buildah push ${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah push ${FRONTEND_IMAGE}:latest

publish-chart:
  stage: publish
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  tags:
    - aacecandev
    - proxmox
  script:
    - helm registry login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - helm package ./helm --version 0.1.0-${CI_COMMIT_SHORT_SHA} --app-version ${CI_COMMIT_SHORT_SHA}
    - helm push blog-0.1.0-${CI_COMMIT_SHORT_SHA}.tgz ${CHART_REGISTRY}
  rules:
    - changes:
        - helm/**/*

deploy:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.17.3
    entrypoint: [""]
  tags:
    - aacecandev
    - proxmox
  script:
    - kubectl config use-context aacecan/apps/blog:k3s-homelab
    - helm registry login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - helm upgrade --install blog ${CHART_REGISTRY}/blog
      --version 0.1.0-${CI_COMMIT_SHORT_SHA}
      --namespace blog
      --create-namespace
      --set backend.image.tag=latest
      --set frontend.image.tag=latest
      --set 'imagePullSecrets[0].name=gitlab-registry'
      --set backend.s3.accessKey=${SEAWEEDFS_ACCESS_KEY}
      --set backend.s3.secretKey=${SEAWEEDFS_SECRET_KEY}
      --wait
      --timeout 5m
  rules:
    - changes:
        - helm/**/*

sync-posts:
  stage: sync
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  tags:
    - aacecandev
    - proxmox
  variables:
    AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    SEAWEEDFS_ENDPOINT: http://seaweedfs-s3.seaweedfs:8333
    SEAWEEDFS_BUCKET: blog-content
  script:
    - aws --endpoint-url ${SEAWEEDFS_ENDPOINT} s3 sync
      content/posts/ s3://${SEAWEEDFS_BUCKET}/posts/
      --delete
  rules:
    - changes:
        - content/posts/**/*
