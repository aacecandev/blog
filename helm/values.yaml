global:
  imageRegistry: registry.aacecan.com/aacecan/apps/blog

imagePullSecrets: []

backend:
  image:
    repository: ""  # defaults to global.imageRegistry/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  s3:
    accessKey: ""  # set via CI: --set backend.s3.accessKey=$SEAWEEDFS_ACCESS_KEY
    secretKey: ""  # set via CI: --set backend.s3.secretKey=$SEAWEEDFS_SECRET_KEY
  env:
    DEV_BLOG_CONTENT_DIR: ""
    DEV_BLOG_S3_BUCKET: blog-content
    DEV_BLOG_S3_PREFIX: "posts/"
    DEV_BLOG_S3_ENDPOINT_URL: "http://seaweedfs-s3.seaweedfs.svc:8333"
    DEV_BLOG_CACHE_TTL_SECONDS: "300"
    DEV_BLOG_OLLAMA_URL: ""
    DEV_BLOG_OLLAMA_MODEL: ""
  envFrom:
    - secretRef:
        name: blog-s3-credentials
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

frontend:
  image:
    repository: ""  # defaults to global.imageRegistry/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

httproute:
  enabled: true
  hostname: blog.aacecan.com
  gateway:
    name: main
    namespace: gateway-system
    sectionName: https
