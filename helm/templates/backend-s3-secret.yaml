---
{{- if and .Values.backend.s3.accessKey .Values.backend.s3.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: blog-s3-credentials
  labels:
    {{- include "blog.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  DEV_BLOG_S3_ACCESS_KEY: {{ .Values.backend.s3.accessKey | quote }}
  DEV_BLOG_S3_SECRET_KEY: {{ .Values.backend.s3.secretKey | quote }}
{{- end }}
