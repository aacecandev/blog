# Builds a Packer AMI for the dev-blog EC2 instance.
# Trigger: manual dispatch or changes to packer/ directory.
#
# Required repository secrets (choose one auth method):
# - AWS_ROLE_TO_ASSUME (recommended, OIDC)
# OR
# - AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (fallback)
# - AWS_SESSION_TOKEN (optional, for temporary credentials)

name: Build AMI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region to build the AMI in"
        required: false
        default: "eu-west-1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-ami
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION || 'eu-west-1' }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'feat(packer):')
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: env.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer init
        working-directory: packer
        run: packer init .

      - name: Packer validate
        working-directory: packer
        run: packer validate -var="aws_region=${AWS_REGION}" -var="git_sha=${GITHUB_SHA}" .

      - name: Packer build
        id: build
        working-directory: packer
        run: |
          set -euo pipefail

          packer build \
            -var="aws_region=${AWS_REGION}" \
            -var="git_sha=${GITHUB_SHA}" \
            -color=false \
            . | tee packer-output.log

          AMI_ID=$(grep -oP 'ami-[0-9a-f]+' packer-output.log | tail -1)

          if [ -z "${AMI_ID}" ]; then
            echo "::error::Failed to extract AMI ID from Packer output"
            exit 1
          fi

          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          echo "## AMI Built Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AMI ID**: \`${AMI_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Region**: \`${AWS_REGION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup old AMIs (keep last 3)
        if: success()
        env:
          AMI_KEEP_COUNT: "3"
        run: |
          set -euo pipefail

          # List all dev-blog AMIs sorted by creation date (oldest first)
          AMIS=$(aws ec2 describe-images \
            --owners self \
            --filters \
              "Name=tag:Project,Values=dev-blog" \
              "Name=tag:ManagedBy,Values=packer" \
            --query "sort_by(Images, &CreationDate)[:-${AMI_KEEP_COUNT}].[ImageId,BlockDeviceMappings[0].Ebs.SnapshotId,CreationDate]" \
            --output text)

          if [ -z "${AMIS}" ]; then
            echo "No old AMIs to clean up (${AMI_KEEP_COUNT} or fewer exist)."
            exit 0
          fi

          DEREGISTERED=0
          while IFS=$'\t' read -r AMI_ID SNAPSHOT_ID CREATED; do
            echo "Deregistering ${AMI_ID} (created: ${CREATED})..."
            aws ec2 deregister-image --image-id "${AMI_ID}"

            if [ -n "${SNAPSHOT_ID}" ] && [ "${SNAPSHOT_ID}" != "None" ]; then
              echo "  Deleting snapshot ${SNAPSHOT_ID}..."
              aws ec2 delete-snapshot --snapshot-id "${SNAPSHOT_ID}"
            fi

            DEREGISTERED=$((DEREGISTERED + 1))
          done <<< "${AMIS}"

          echo "## AMI Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deregistered **${DEREGISTERED}** old AMI(s), keeping last **${AMI_KEEP_COUNT}**" >> "$GITHUB_STEP_SUMMARY"
